name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  lint:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Lint
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the secret scan and the changed-file diff
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Always runs, so docs-only changes still pass through the required Lint check.
      - name: Secret scan
        run: node .githooks/secure-git.mjs scan-history
      # Docs-only = every changed file is under docs/ or ends in .md. Those skip lint and deploy.
      - name: Detect docs-only change
        id: changes
        env:
          # PRs check out a merge commit, so its first parent is the base it was built on.
          BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # --no-renames lists both paths, so moving a site file to *.md isn't docs-only.
          # If the base is unreachable (e.g. rewritten history), run the full pipeline.
          files=$(git diff --name-only --no-renames "$BASE" HEAD) || { echo "docs_only=false" >> "$GITHUB_OUTPUT"; exit 0; }
          echo "$files"
          if [ -n "$files" ] && ! echo "$files" | grep -qvE '^docs/|\.md$'; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm ci
      - if: steps.changes.outputs.docs_only != 'true'
        run: npm run lint

  build_and_deploy_job:
    needs: lint
    if: needs.lint.outputs.docs_only != 'true' && (github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # One deploy per ref at a time, so the post-deploy fingerprint check on main
    # can't see a newer deploy that started after this one.
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
      pull-requests: write # lets the deploy action comment the preview URL on PRs
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false
      # The deploy token is not stored in GitHub. Sign in as the managed identity
      # id-lukerebarchikcom-github-deploy (OIDC, no password) and fetch it per run.
      # That identity can only call listSecrets on this one Static Web App.
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch deployment token
        id: swatoken
        run: |
          token=$(az staticwebapp secrets list -n lukerebarchikcom-github -g lukerebarchikcom-github --query properties.apiKey -o tsv)
          [ -n "$token" ] || { echo "::error::Could not fetch the Static Web App deployment token"; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      # Version fingerprint (#26): same npm script as local use, stamped with this commit.
      - name: Stamp version fingerprint
        run: npm run fingerprint -- --commit "${GITHUB_SHA::7}" --date "$(date -u +%F)"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swatoken.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "" # Api source code path - optional
          output_location: "/" # Built app content directory - optional
          skip_app_build: true # Plain static site; package.json is only for linting
          ###### End of Repository/Build Configurations ######
      # Confirm the deployed page is this commit (retries while the deploy propagates).
      - name: Verify deployed fingerprint
        env:
          SITE_URL: ${{ steps.builddeploy.outputs.static_web_app_url }}
        run: |
          [ -n "$SITE_URL" ] || { echo "::error::Deploy step returned no static_web_app_url"; exit 1; }
          npm run fingerprint -- --verify "$SITE_URL" --commit "${GITHUB_SHA::7}" --attempts 12
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            npm run fingerprint -- --verify https://lukerebarchik.com/ --commit "${GITHUB_SHA::7}" --attempts 12
          fi

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    permissions:
      contents: read
      id-token: write # OIDC sign-in to Azure
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Fetch deployment token
        id: swatoken
        run: |
          token=$(az staticwebapp secrets list -n lukerebarchikcom-github -g lukerebarchikcom-github --query properties.apiKey -o tsv)
          [ -n "$token" ] || { echo "::error::Could not fetch the Static Web App deployment token"; exit 1; }
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swatoken.outputs.token }}
          action: "close"
